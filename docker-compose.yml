version: "3.9"

services:
  resonance:
    build: .
    container_name: resonance
    restart: unless-stopped

    ports:
      - "8000:8000"  # 可选：调试用；正式部署可注释掉（仅 nginx 访问）
    env_file:
      - .env

    volumes:
      - ./config:/app/config    # ⭐ 配置热更新
      - ./logs:/app/logs        # ⭐ 日志持久化

    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8000

    networks:
      - appnet

  # 老五 bot 监听器：Telethon 以用户账号监听老五 bot，转发到 resonance /webhook/laowu
  # 首次需交互登录：docker compose run --rm laowu-listener   （登录成功后 Ctrl+C）
  # 之后：docker compose up -d laowu-listener
  laowu-listener:
    build: .
    container_name: laowu-listener
    restart: unless-stopped
    env_file:
      - .env   # TG_API_ID / TG_API_HASH / LAOWU_BOT_ID
    environment:
      LAOWU_WEBHOOK_URL: http://resonance:8000/webhook/laowu
    working_dir: /app/session   # Telethon session 文件落在这里
    volumes:
      - ./scripts:/app/scripts:ro
      - ./data/laowu_session:/app/session   # ⭐ session 持久化（data/ 已 gitignore）
    command: python /app/scripts/laowu_listener.py
    stdin_open: true
    tty: true
    depends_on:
      - resonance
    networks:
      - appnet

  nginx:
    image: nginx:latest
    container_name: nginx-proxy
    restart: unless-stopped
    ports:
      - "80:80"  # 外部请求走 nginx
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - resonance
    networks:
      - appnet

networks:
  appnet:
    driver: bridge
